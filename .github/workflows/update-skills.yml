# The single updater of this repo. Daily it pulls every skill from upstream and commits to main.
# Code changes from `trust = "review"` sources are held (see skills.lock.json "held" and CHANGELOG.md)
# until someone runs `python tools/skillsync.py update --approve <name>` and pushes.
# Machines that use the skills only `git pull` (tools/auto_update.py does that on a schedule).
name: update-skills

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths: ["skills.toml", "tools/**", "skills/**", "skills.lock.json"]

permissions:
  contents: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check current set
        if: github.event_name == 'push'
        run: python tools/skillsync.py check
      - name: Update from upstream and commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          python tools/skillsync.py update --commit || echo "::warning::update reported problems, see CHANGELOG.md"
          python tools/skillsync.py check
          git push
