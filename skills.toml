# What this repo vendors and from where. Edit this file, then:
#   python tools/skillsync.py update && python tools/skillsync.py check && python tools/skillsync.py install
#
# [[skill]] fields:
#   name    folder name of the skill upstream
#   source  key of a [sources.*] block
#   path    folder inside the repo (default: skills/<name>)
#   as      local name, only to dodge a name clash (rewrites the frontmatter `name`)
#   domain  the one job this skill does; two skills may not share a domain
#   exclude glob patterns (relative to the skill folder) not to copy
#   local   true for skills written here; updates never touch them
#
# [sources.*] trust:
#   auto    apply every upstream change
#   review  apply text changes, hold changes to scripts/configs until `update --approve <name>`

[settings]
targets = ["~/.claude/skills", "~/.agents/skills"]
install_mode = "link"          # junctions on Windows, symlinks elsewhere; "copy" for agents that do not follow links
default_trust = "review"
overlap_threshold = 0.3

[settings.plugin]
name = "agent-skills"
owner = "maywaydie"
repository = "https://github.com/maywaydie/agent-skills"
description = "Curated, conflict-checked, auto-updated agent skills for Claude Code, Codex, Cursor and OpenCode"

